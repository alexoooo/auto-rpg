<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics Bench</title>
<style>
  :root { --bg: #15191c; --ink: #e7e3da; --dim: #9aa3a6; --line: #2c3337; --accent: #d9a45b; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 16px; letter-spacing: 0.04em; margin: 0 0 4px; }
  p { color: var(--dim); margin: 0 0 12px; font-size: 13px; }
  button { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  #status { color: var(--accent); margin: 12px 0; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; width: 100%; }
  td { padding: 2px 10px 2px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  #ua { font-size: 11px; word-break: break-all; }
</style>
</head>
<body>
<main>
  <h1>PHYSICS BAKE-OFF</h1>
  <p>MuJoCo and Rapier under one controller: the fidelity cases and N humans a step, on this page's main thread.
    Node's numbers are in <code>research/physics-bakeoff/REPORT.md</code>. <code>?auto=1</code> runs everything.</p>
  <button id="run">Run all</button> <button id="run-fidelity">Fidelity only</button>
  <div id="status">idle</div>
  <div class="scroll"><table><tbody id="rows"></tbody></table></div>
  <p id="ua"></p>
</main>
<script type="module" src="/src/physics-bench/main.ts"></script>
</body>
</html>
