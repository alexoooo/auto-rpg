[workspace]
resolver = "2"
members = [
    "crates/fx",
    "crates/sim",
    "crates/policy",
    "crates/learn-core",
    "crates/learn",
    "crates/lab",
    "crates/web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/alexoooo/auto-rpg"

# Determinism: never let arithmetic silently wrap in release but panic in debug.
# The sim uses saturating math throughout, so this should never fire -- it is a
# tripwire for code that forgets the rule.
[profile.release]
overflow-checks = true

# A test here is thousands of simulated ticks, not a function call. Unoptimised
# fixed-point math makes `cargo test` slow enough that people stop running it,
# which costs far more than the debuggability of `opt-level = 0`.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
