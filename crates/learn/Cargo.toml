[package]
name = "learn"
description = "The learning probe: the population optimizer that trains a compact articulated policy, and the corpora it is scored on"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# A pass-through and not a capability of this crate: it owns no exact-law code
# and gains no API from it.
#
# **Its original reason has expired and the feature is kept for a different
# one.** It was added so `boundary.rs` could tell the two laws apart, because
# `a_zeroed_network_is_a_fighter_and_not_a_statue` pinned a tick count the two
# laws ended differently. That test now asserts the fight runs its full 600-tick
# clock, which both laws satisfy, and **no `cfg(feature = "cartesian-recoil")`
# remains anywhere in this crate**. What keeps the line here is the invocation:
# `cargo test --workspace --features cartesian-recoil` errors on a member that
# does not declare the feature, so removing it would break that spelling. The
# repository gate uses `-p sim -p lab` and does not exercise this crate under
# the feature at all.
cartesian-recoil = ["sim/cartesian-recoil"]

[dependencies]
fx = { path = "../fx" }
sim = { path = "../sim" }
policy = { path = "../policy" }
learn-core = { path = "../learn-core" }

# No sha2, no rand, no rayon, and no ndarray. The workspace has zero external
# dependencies and `tools/check_deps.js` audits this crate for one. The digest
# in `learn-core`'s `checkpoint.rs` is a hundred lines of hand-rolled SHA-256
# for exactly that reason; the argument is on the module rather than repeated
# here.
#
# The arrow to `learn-core` and never back. That crate compiles to
# `wasm32-unknown-unknown` and is `web`'s dependency; this one uses
# `std::thread::scope` and a wall clock, and its one host is native `lab`.
