[package]
name = "web"
description = "The browser boundary: a hand-rolled C ABI over the sim, with no bindgen"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# `cdylib` is the artifact the browser loads. `rlib` is what makes
# `cargo test -p web` possible, so the boundary's own logic -- the frame layout,
# the decision loop, the selftest hash -- is checked natively on every
# `cargo test` rather than only by opening a page.
crate-type = ["cdylib", "rlib"]

[features]
cartesian-recoil = ["sim/cartesian-recoil"]

[dependencies]
fx = { path = "../fx" }
sim = { path = "../sim" }
policy = { path = "../policy" }
# The frozen network, and **not** `learn`. v2-ui-08 split the two precisely so
# this line could exist: `learn-core` is inference, a checkpoint codec and a
# fixed action table; `learn` is the trainer, and it uses `std::thread::scope`
# and a wall clock, neither of which belongs in a `cdylib`.
#
# It is the one dependency here that uses floating point. The premise that makes
# that affordable is unchanged and is the reason it is affordable at all: what
# crosses out of it is five head indices from an argmax, and
# `World::submit_articulated_v1` cannot be handed anything else.
# `LEARNED_INFERENCE_DIGEST` is what keeps the crossing honest between this
# target and the native one.
learn-core = { path = "../learn-core" }

# No wasm-bindgen, no js-sys, no web-sys. Host and presentation code may use
# audited exact dependencies, but this boundary does not need one: it is a dozen
# functions passing integers, small enough to hand roll and read in one sitting.
# Keeping the boundary local also makes it plain that no host type reaches the
# authoritative state or either hash domain.
