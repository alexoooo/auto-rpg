<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15191c">
<title>Core Lab</title>
<style>
  :root { --bg: #15191c; --panel: rgba(21, 25, 28, 0.86); --ink: #e7e3da; --dim: #9aa3a6; --accent: #d9a45b; --line: #2c3337; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #panel { position: absolute; top: 16px; left: 16px; width: min(320px, calc(100vw - 32px)); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; box-sizing: border-box; }
  h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: 0.04em; }
  .sub { color: var(--dim); font-size: 12px; margin: 0 0 12px; }
  .models { display: flex; gap: 6px; margin-bottom: 12px; }
  .models button, #restart { flex: 1; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 8px; cursor: pointer; font: inherit; }
  .models button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0 0 10px; }
  dt { color: var(--dim); } dd { margin: 0; font-variant-numeric: tabular-nums; }
  #fist { font-size: 22px; color: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; margin-bottom: 10px; }
  th, td { text-align: left; padding: 2px 0; border-bottom: 1px solid var(--line); } th { color: var(--dim); font-weight: normal; }
  td:last-child, th:last-child { text-align: right; }
  #restart { width: 100%; }
  #transport { position: absolute; left: 352px; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  #transport button { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 10px; cursor: pointer; font: inherit; min-width: 36px; }
  #pause { min-width: 64px; }
  #pause[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  #timeline { flex: 1; accent-color: var(--accent); }
  #clock { font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; color: var(--dim); }
  @media (max-width: 720px) { #transport { left: 16px; } }
</style>
</head>
<body>
<canvas id="stage" tabindex="0" aria-label="The core human on its routine. Drag to orbit, scroll to zoom."></canvas>
<div id="panel">
  <h1>CORE LAB</h1>
  <p class="sub">Stage 2: the muscle actuator</p>
  <div class="models" role="group" aria-label="Character">
    <button data-model="workshop-fighter" aria-pressed="true">Warrior</button>
    <button data-model="workshop-rogue" aria-pressed="false">Rogue</button>
  </div>
  <div class="models" role="group" aria-label="View">
    <button data-view="world" aria-pressed="true" title="The workshop model's skin, carried by the segments">World</button>
    <button data-view="tactical" aria-pressed="false" title="The collision shapes the solver moves">Tactical</button>
  </div>
  <div class="models" role="group" aria-label="Physics rate">
    <button data-hz="120" aria-pressed="true" title="The game's rate">120 Hz</button>
    <button data-hz="480" aria-pressed="false" title="A finer step, where the readings converge">480 Hz</button>
  </div>
  <dl>
    <dt>Doing</dt><dd id="doing">-</dd>
    <dt>Fist</dt><dd><span id="fist">0.0</span> m/s</dd>
  </dl>
  <table><thead><tr><th>Strike</th><th>Peak fist, m/s</th></tr></thead><tbody id="strikes"></tbody></table>
  <button id="restart">Restart</button>
</div>
<div id="transport" role="group" aria-label="Timeline">
  <button id="pause" aria-pressed="false" title="Pause or play the world (Space)">Pause</button>
  <button data-nudge="-1" title="Back one physics step">&#9664;</button>
  <button data-nudge="1" title="Forward one physics step">&#9654;</button>
  <input id="timeline" type="range" min="0" max="0" step="1" value="0"
    aria-label="The routine's loop, one physics step a notch; dragging pauses. Arrow keys step once it has focus.">
  <span id="clock">0.000 s</span>
</div>
<script type="module" src="/src/core-lab/main.ts"></script>
</body>
</html>
