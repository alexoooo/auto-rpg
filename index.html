<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auto-RPG</title>
    <!-- Before any stylesheet arrives: every screen change is a page load, and this keeps it dark. -->
    <style>
      html, body { margin: 0; background: #0a0b0e; color-scheme: dark; }
    </style>
  </head>
  <body>
    <!-- One document, four screens. src/app.ts mounts exactly one of these per page load, so
         the arena, the dungeon and the lab may share ids (#help, #resume, #stage) and never meet. -->
    <template id="menu-screen">
      <main id="title-screen">
        <h1>Auto-RPG</h1>
        <nav aria-label="Main menu">
          <button id="menu-new-game" type="button">New Game</button>
          <button id="menu-arena" type="button">Arena</button>
          <button id="menu-lab" type="button">Lab</button>
        </nav>
      </main>
    </template>
    <template id="arena-screen">
      <canvas id="stage"></canvas>
      <div id="hud"></div>
      <div id="mode"></div>
      <!-- Setup replaces the arena because no bout exists yet. Pause does not:
           its compact sibling below leaves the frozen arena visible. -->
      <!-- One grid over the live arena: a title across the top, a contender panel at each edge, an
           open centre where the two bodies stand, Fight under them and a footer. -->
      <div id="curtain">
        <header class="duel-title">
          <h1>Golem Duel</h1>
          <p>Two bodies built from parts, and a fight that is only physics.</p>
        </header>
        <!-- Filled by src/setup.ts from the unit and policy registries, so an option that is
             offered is one the code actually has. Its children are laid straight into this grid. -->
        <div id="matchup"></div>
        <button id="begin" class="action" type="button">Fight</button>
        <footer class="duel-footer">
          <button id="help-open" class="link" type="button">How to play</button>
          <p class="note" id="boot-note">Loading Havok&hellip;</p>
          <a href="./">&larr; Main menu</a>
        </footer>
      </div>
      <!-- Real-time-with-pause mode: a control surface in the game view, not a
           second screen. Focus loss (including a screenshot tool taking focus)
           freezes the world and reveals this without covering the composition. -->
      <aside id="pause-menu" class="gone" aria-label="Game paused">
        <div class="pause-copy">
          <strong>PAUSED</strong>
          <span>Arena frozen &middot; Space or Esc resumes</span>
        </div>
        <div class="pause-actions">
          <button id="resume" class="action" type="button">Resume</button>
          <button id="restart" class="action quiet" type="button">Replay</button>
          <button id="random-replay" class="action quiet" type="button">Random replay</button>
          <button id="leave" class="action quiet" type="button">Setup</button>
          <button id="to-menu" class="action quiet" type="button">Main menu</button>
        </div>
        <span class="pause-help"><b>?</b> controls</span>
      </aside>
      <!-- The end of a bout: the same fight again, or the corner you do not drive redrawn. Its own
           element, shown only while a bout is decided, and never the curtain or the pause menu. -->
      <aside id="bout-end" class="gone" aria-label="Bout over">
        <button id="bout-end-replay" class="action" type="button">Replay</button>
        <button id="bout-end-random" class="action" type="button">Random replay</button>
        <button id="bout-end-leave" class="action quiet" type="button">Setup</button>
      </aside>
      <!-- The controls, on their own overlay rather than on the curtain.
           Seventeen rows above the Fight button pushed it off the bottom of a
           laptop window and had to be scrolled past every time a bout was
           chosen; `?` is where a key list belongs and it works mid-fight too. -->
      <div id="help" class="gone">
        <div class="panel">
          <h1>Controls</h1>
          <p class="lede">
            You <b>command</b>; you do not puppet. The side you command is fought by its own
            policy &mdash; arms, guard and footwork &mdash; and what you give it are orders:
            whom to attack and where to go. It keeps defending itself while it goes.
          </p>
          <dl class="keys">
            <dt>Command / Stand down</dt><dd>beside each fighter&rsquo;s name in the readout &mdash; give that side orders, or hand it back to its own orders, in a fight or a pause</dd>
            <dt>Click the enemy</dt><dd>attack it &mdash; and drop any place to hold</dd>
            <dt>Click the floor</dt><dd>go there and hold it, fighting from there</dd>
            <dt>Right-click the floor</dt><dd>attack-move &mdash; walk there, and fight whatever comes near</dd>
            <dt>W / A / S / D</dt><dd>steer, relative to the camera &mdash; let go to hold where you stopped</dd>
            <dt>H</dt><dd>hold the ground you are standing on</dd>
            <dt>X</dt><dd>no orders &mdash; fight the nearest, as a side with none does</dd>
            <dt>Middle drag</dt><dd>orbit the camera; hold Shift to pan</dd>
            <dt>Wheel</dt><dd>zoom &mdash; the camera only; no fighter is asked for anything</dd>
            <dt>V</dt><dd>camera &mdash; Overhead behind the fighter, or Fixed on a world bearing</dd>
            <dt>[ / ]</dt><dd>swing the Fixed camera round the arena</dd>
            <dt>Space / Esc</dt><dd>pause, and resume &mdash; the same key both ways</dd>
            <dt>R</dt><dd>this bout again</dd>
            <dt>Random replay</dt><dd>at a verdict or in the pause menu &mdash; the side you are not commanding is redrawn</dd>
            <dt>Tab</dt><dd>toggle the physics readout</dd>
            <dt>?</dt><dd>this list</dd>
          </dl>
          <h2>Policies</h2>
          <!-- Filled by src/main.ts from `POLICIES` and `policyLine`, so the list is every policy
               the pickers offer, in their order. -->
          <dl class="keys policy-list" id="help-policies"></dl>
          <button id="help-close" class="action" type="button">Close</button>
        </div>
      </div>
    </template>
    <template id="dungeon-screen">
      <canvas id="dungeon" aria-label="Dungeon game" tabindex="0"></canvas>
      <header class="topbar">
        <a href="./" class="brand">AUTO-RPG <span>/ THE DEPTHS</span></a>
        <div class="objective"><span class="diamond">◇</span> FIND THE EXIT <small id="seed-label"></small></div>
        <div class="topbar-end"><small id="frame-meter" aria-label="Frame counter"></small><button id="pause-button" type="button">Pause <kbd>Esc</kbd></button></div>
      </header>
      <section id="target-panel" hidden aria-label="Selected enemy"><span id="target-name"></span><progress id="target-hp" max="1" value="1"></progress></section>
      <div id="notice" role="status">Preparing the dungeon…</div>
      <footer class="bottom-bar">
        <section class="hero-panel"><span class="eyebrow">YOUR GOLEM</span><strong id="hero-name">Stone wanderer</strong><small id="hero-attributes-line"></small>
          <div class="health"><progress id="hero-hp" max="1" value="1"></progress><span id="hp-label">100% HP</span></div>
        </section>
        <section class="control-panel"><span class="eyebrow">TAKE CONTROL</span>
          <div class="switches"><label><input id="keyboard" type="checkbox" /> Keyboard movement</label><label><input id="facing" type="checkbox" /> Mouse facing</label></div>
          <small id="control-help">Click to attack-move · click an enemy to lock on · drag to force move</small>
        </section>
        <section class="party-panel" aria-label="Your party"><span class="eyebrow">YOUR PARTY <kbd>1</kbd>–<kbd>4</kbd> · <kbd>0</kbd> all · <kbd>F</kbd> regroup</span>
          <ol id="party-list"></ol>
        </section>
        <button id="help-button" type="button" aria-expanded="false">Controls <kbd>?</kbd></button>
      </footer>
      <section id="start-panel" class="dialog" aria-labelledby="start-title">
        <span class="eyebrow">A GOLEM DUNGEON RUN</span><h1 id="start-title">Into the depths.</h1>
        <p>Stone corridors. Unfamiliar enemies.<br />One way out. Your hero fights — you choose the way.</p>
        <label class="field">Dungeon <select id="dungeon-scene"><option value="generated">Generated depths</option><option value="reference">The Rootbound Crypt</option><option value="random-crypt">Random Crypt</option></select></label>
        <label class="field" hidden>Quality <select id="dungeon-quality"><option value="high">High</option><option value="reduced">Reduced</option></select></label>
        <label class="field">Your hero <select id="hero-build"></select></label>
        <div id="hero-equipment" hidden>
          <label class="field">Main hand <select id="hero-primary"></select></label>
          <label class="field">Other hand <select id="hero-secondary"></select></label>
        </div>
        <div id="hero-attributes"></div>
        <label class="field">Companions <select id="companions"><option value="0">None</option><option value="1">One</option><option value="2" selected>Two</option><option value="3">Three</option></select></label>
        <label class="field">Dungeon seed <input id="seed" type="text" inputmode="numeric" maxlength="10" /></label>
        <button id="start" class="primary" disabled>Preparing Havok…</button>
        <small>Physical combat · one floor · no upgrades or saved progress</small>
        <a class="back" href="./">← Main menu</a>
      </section>
      <section id="pause-panel" class="dialog compact" hidden aria-labelledby="pause-title">
        <span class="eyebrow">THE DEPTHS</span><h2 id="pause-title">Paused</h2><p id="pause-copy">Your run is frozen.</p>
        <button id="resume" class="primary">Resume</button><button id="retry">Retry same seed</button><button id="new-run">New dungeon</button>
        <a href="./">Main menu</a>
      </section>
      <section id="help" class="dialog help" hidden>
        <h2>Your hero fights automatically.</h2>
        <p>With both switches off, <b>click the floor</b> to attack-move, <b>click an enemy</b> to lock on, or <b>drag a route</b> to keep moving through danger. The hero follows while you draw.</p>
        <p>You order a <b>party</b>. An order goes to whoever is selected: everybody at first. <b>1</b>–<b>4</b> or a click on a party member or its row selects that one alone, <b>Shift</b> adds it, <b>0</b> selects everybody. A companion you sent somewhere holds there; <b>F</b> calls the selected companions back to the hero, whom an idle companion follows. Enemies go for whichever of you they see nearest, and the run lasts while anybody stands.</p>
        <p><b>Keyboard movement</b> uses WASD or arrows, relative to the screen. <b>Mouse facing</b> turns toward the cursor. Each switch gives its channel to you and leaves the other to the AI. With mouse facing alone, the hero explores automatically.</p>
        <p>Attacks and counters are always automatic. Brief dodges may adjust movement. Doors open on approach. Reach the green exit circle to escape.</p>
        <p><b>Wheel</b> zooms · <b>Space / Esc</b> pauses · <b>?</b> closes this help.</p><button id="close-help">Got it</button>
      </section>
    </template>
    <!-- The lab, in two templates: its scenario menu (`?play=lab`, src/core-lab/setup.ts) and a
         scenario running (`?play=lab&scenario=...`, src/core-lab/main.ts). -->
    <template id="lab-select-screen">
      <main id="lab-select">
        <h1>LAB</h1>
        <nav id="lab-scenarios" aria-label="Scenarios"></nav>
        <a href="./">&larr; Main menu</a>
      </main>
    </template>
    <template id="lab-screen">
      <canvas id="stage" tabindex="0" aria-label="The core human. Drag to orbit, scroll to zoom; in the Stance, W A S D or the arrows walk it; in the Run, it goes round its track."></canvas>
      <div id="panel">
        <a id="to-scenarios" href="?play=lab">&larr; Scenarios</a>
        <h1 id="scenario-name">Lab</h1>
        <div class="loadout" role="group" aria-label="Loadout">
          <span>Body</span>
          <div class="models" role="group" aria-label="Body">
            <button data-model="workshop-fighter" aria-pressed="true">Warrior</button>
            <button data-model="workshop-rogue" aria-pressed="false">Rogue</button>
          </div>
          <span>Right hand</span>
          <div class="models" role="group" aria-label="Right hand">
            <button data-hand="right" data-held="empty" aria-pressed="true">Empty</button>
            <button data-hand="right" data-held="club" aria-pressed="false">Club</button>
          </div>
          <span>Left hand</span>
          <div class="models" role="group" aria-label="Left hand">
            <button data-hand="left" data-held="empty" aria-pressed="true">Empty</button>
            <button data-hand="left" data-held="club" aria-pressed="false">Club</button>
          </div>
          <span>Wears</span>
          <div class="models" role="group" aria-label="Clothing">
            <button data-wear="boots" aria-pressed="true" title="Appearance only">Boots</button>
            <button data-wear="armour" aria-pressed="true" title="Appearance only">Armour</button>
          </div>
        </div>
        <div class="models" role="group" aria-label="View">
          <button data-view="world" aria-pressed="true" title="The workshop model's skin, carried by the segments">World</button>
          <button data-view="tactical" aria-pressed="false" title="The collision shapes the solver moves">Tactical</button>
        </div>
        <div class="models" role="group" aria-label="Camera">
          <button data-camera="free" aria-pressed="true" title="Drag to orbit, right-drag to pan">Free</button>
          <button data-camera="isometric" aria-pressed="false">Isometric</button>
          <button data-camera="chase" aria-pressed="false" title="Behind the body, turning after it">Chase</button>
        </div>
        <div id="projection" class="models" role="group" aria-label="Isometric projection" hidden>
          <button data-projection="orthographic" aria-pressed="true">Orthographic</button>
          <button data-projection="perspective" aria-pressed="false">Perspective</button>
        </div>
        <div class="models" role="group" aria-label="Physics rate">
          <button data-hz="120" aria-pressed="true" title="The game's rate">120 Hz</button>
          <button data-hz="480" aria-pressed="false" title="A finer step, where the readings converge">480 Hz</button>
        </div>
        <div data-for="stance">
          <p class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> or arrows walk &middot; <kbd>Q</kbd><kbd>E</kbd> turn while walking
            &middot; <kbd>Space</kbd> pauses</p>
          <p class="label">Walking speed, m/s</p>
          <div class="models" role="group" aria-label="Walking speed">
            <button data-speed="0.2" aria-pressed="false">0.2</button>
            <button data-speed="0.3" aria-pressed="true">0.3</button>
            <button data-speed="0.4" aria-pressed="false">0.4</button>
            <button data-speed="0.5" aria-pressed="false">0.5</button>
          </div>
          <p class="label">Shove the chest toward</p>
          <div class="models" role="group" aria-label="Shove">
            <select id="impulse" aria-label="Impulse, N s" title="Impulse, N s">
              <option value="10">10 N s</option><option value="20">20 N s</option><option value="30" selected>30 N s</option>
              <option value="40">40 N s</option><option value="60">60 N s</option>
            </select>
            <button data-shove="0" title="Toward where it faces">Front</button>
            <button data-shove="180" title="Toward its back">Back</button>
            <button data-shove="270" title="Toward its left">Left</button>
            <button data-shove="90" title="Toward its right">Right</button>
          </div>
          <dl>
            <dt>Doing</dt><dd id="s-phase">-</dd>
            <dt>State</dt><dd id="s-state">-</dd>
            <dt>Walking steps</dt><dd id="s-strides">0</dd>
            <dt>Catching steps</dt><dd id="s-recoveries">0</dd>
            <dt>Speed</dt><dd><span id="s-speed">0.00</span> m/s</dd>
            <dt>Height / goal</dt><dd><span id="s-height">-</span> m</dd>
            <dt>Off its place</dt><dd><span id="s-off">0.0</span> cm</dd>
            <dt>Heading</dt><dd><span id="s-heading">0</span>&deg;</dd>
          </dl>
          <p class="note"><span class="swatch" style="background:#f2bf66"></span>centre of mass
            <span class="swatch" style="background:#e64d40"></span>capture point
            <span class="swatch" style="background:#59a6e6"></span>the place it holds the centre toward</p>
        </div>
        <div data-for="routine" hidden>
          <dl>
            <dt>Doing</dt><dd id="doing">-</dd>
            <dt>Fist</dt><dd><span id="fist">0.0</span> m/s</dd>
          </dl>
          <table><thead><tr><th>Strike</th><th>Peak fist, m/s</th></tr></thead><tbody id="strikes"></tbody></table>
        </div>
        <div data-for="run" hidden>
          <p class="label">Track</p>
          <div class="models" role="group" aria-label="Track">
            <button data-track="circle" aria-pressed="true">Big circle</button>
            <button data-track="shuttle" aria-pressed="false">Back and forth</button>
          </div>
          <dl>
            <dt>Doing</dt><dd id="r-doing">-</dd>
            <dt>State</dt><dd id="r-state">-</dd>
            <dt>Laps</dt><dd id="r-laps">0</dd>
            <dt>Last lap</dt><dd><span id="r-lap">-</span> s</dd>
            <dt>Speed</dt><dd><span id="r-speed">0.00</span> m/s</dd>
            <dt>Mean speed</dt><dd><span id="r-mean">0.00</span> m/s</dd>
            <dt>Pace asked</dt><dd><span id="r-pace">0.00</span> m/s</dd>
            <dt>Off the track</dt><dd><span id="r-off">0.0</span> cm</dd>
          </dl>
          <p class="note"><span class="swatch" style="background:#d9a35c"></span>the track
            <span class="swatch" style="background:#f2bf66"></span>centre of mass
            <span class="swatch" style="background:#59a6e6"></span>the point it aims at</p>
        </div>
        <div data-for="blow" hidden>
          <p class="label">Blow</p>
          <div id="b-choice" class="models" role="group" aria-label="Blow"></div>
          <p id="b-about" class="note"></p>
          <dl>
            <dt>Doing</dt><dd id="b-doing">-</dd>
            <dt>Since the pushes</dt><dd><span id="b-since">-</span> s</dd>
            <dt>Closing speed</dt><dd><span id="b-closing">-</span> m/s</dd>
            <dt>Energy</dt><dd><span id="b-energy">-</span> J</dd>
            <dt>Worth</dt><dd><span id="b-hp">-</span> HP</dd>
            <dt>Club's mass met</dt><dd><span id="b-club">-</span> kg</dd>
            <dt>Head's mass met</dt><dd><span id="b-head">-</span> kg</dd>
            <dt>Swell's peak</dt><dd><span id="b-peak">0.0</span> m/s</dd>
            <dt>Rate</dt><dd><span id="b-rate">-</span> Hz</dd>
          </dl>
          <p class="note"><span class="swatch" style="background:#d95a4d"></span>the head (a mark: the club passes through)
            <span class="swatch" style="background:#ffd94d"></span>where it touched. It pauses after the blow; Restart throws it again.</p>
        </div>
        <button id="restart">Restart</button>
      </div>
      <div id="transport" role="group" aria-label="Timeline">
        <button id="pause" aria-pressed="false" title="Pause or play the world (Space)">Pause</button>
        <button data-nudge="-1" title="Back one physics step">&#9664;</button>
        <button data-nudge="1" title="Forward one physics step">&#9654;</button>
        <input id="timeline" type="range" min="0" max="0" step="1" value="0"
          aria-label="The recording, one physics step a notch; dragging pauses. Arrow keys step once it has focus.">
        <span class="speed" role="group" aria-label="Speed">
          <button data-rate="1" aria-pressed="true" title="Real time">1&times;</button>
          <button data-rate="0.25" aria-pressed="false" title="A quarter speed">&frac14;&times;</button>
          <button data-rate="0.1" aria-pressed="false" title="A tenth speed">1/10&times;</button>
        </span>
        <span id="clock">0.000 s</span>
      </div>
    </template>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
