<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auto RPG studio</title>
  <style>
    :root {
      color-scheme: dark;
      font: 15px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      background: #0b0a08;
      color: #c9bfa8;
      --studio-void: #0b0a08;
      --studio-panel: #15120e;
      --studio-panel-line: #312a1e;
      --studio-ink: #c9bfa8;
      --studio-dim: #8c8474;
      --studio-faint: #5c564a;
      --studio-cyan: #7fa6bd;
      --studio-red: #c0705e;
      --studio-amber: #e8b45c;
      --studio-scrim: rgba(11, 10, 8, .88);
      --studio-bevel: inset 0 1px 0 rgba(201, 191, 168, .06);
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background:
      radial-gradient(80rem 44rem at 50% 18%, #1d1811 0%, transparent 72%), var(--studio-void); }
    a { color: var(--studio-cyan); }
    .muted { color: var(--studio-dim); }

    /* ---- the shell chrome ---- */
    #studio-bar { display: flex; gap: .9rem; align-items: baseline; padding: .45rem 1rem;
      background: rgba(11, 10, 8, .94); border-bottom: 1px solid var(--studio-panel-line);
      box-shadow: var(--studio-bevel); position: sticky; top: 0; z-index: 5; }
    #studio-bar a { text-decoration: none; }
    #studio-title { font: 600 .9rem/1 ui-serif, Georgia, serif; letter-spacing: .08em;
      text-transform: uppercase; color: var(--studio-ink); }
    #studio-route { font: .72rem/1 ui-monospace, Consolas, monospace; letter-spacing: .06em;
      text-transform: uppercase; color: var(--studio-faint); }
    #studio-error { margin-left: auto; color: var(--studio-red); font-size: .8rem; }
    #studio-root { padding: clamp(.45rem, 1.2vw, 1rem); }
    body:has(#studio-root > .route-game) { overflow: hidden; }
    #studio-root:has(> .route-game) { padding: 0; }

    /* Shared control chrome. Both routes draw buttons, selects and ranges, and a
       single vocabulary is what makes the two read as one application. Where a
       route needs its own layout it says so under its own class below. */
    button, select, input { font: inherit; }
    button { padding: .3rem .6rem; border-radius: .3rem; border: 1px solid #465568;
      background: #26374b; color: inherit; cursor: pointer; }
    button:hover { background: #304760; }
    button:disabled, button:disabled:hover { background: #1a222c; color: #718092;
      border-color: #2d3845; cursor: not-allowed; opacity: .65; }
    /* Deliberately not a bare `input` selector: a range or a checkbox given a
       background, a border and a radius stops looking like the native control it
       is, and both routes use both. */
    select, input[type="number"], input[type="text"] {
      background: #171e27; color: inherit; border: 1px solid #465568;
      border-radius: .3rem; padding: .25rem .4rem; }

    /* ---- the main screen ---- */
    .route-home { width: min(60rem, 100%); margin: 2rem auto; display: grid; gap: 1.25rem; }
    .route-home h1 { font-size: 1.6rem; margin: 0; }
    .destinations { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1rem; }
    .destination { display: grid; gap: .4rem; align-content: start; padding: 1rem;
      background: #151b23; border: 1px solid #24303d; border-radius: .5rem; }
    .destination h2 { font-size: 1.1rem; margin: 0; }
    .destination p { margin: 0; color: #aeb9c6; font-size: .9rem; }
    .destination a.enter { justify-self: start; margin-top: .35rem; padding: .35rem .8rem;
      border-radius: .3rem; border: 1px solid #465568; background: #26374b;
      color: inherit; text-decoration: none; }
    .destination a.enter:hover { background: #304760; }

    /* ---- the game route (the v2 worker boundary) ---- */
    .route-game { width: min(76rem, 100%); margin: 0 auto; }
    .route-game h1 { font-size: 1.5rem; margin-bottom: .25rem; }
    .route-game p { color: #aeb9c6; }
    .route-game fieldset { border: 1px solid #34404d; border-radius: .5rem; margin: 1rem 0; padding: 1rem; }
    .route-game .controls { display: flex; flex-wrap: wrap; gap: .6rem; align-items: end; }
    .route-game label { display: grid; gap: .2rem; color: #aeb9c6; font-size: .8rem; }
    .route-game input, .route-game button { padding: .45rem .65rem; border-radius: .35rem; }
    .route-game input[type="number"] { width: 7rem; }
    .route-game input[type="text"] { width: 12rem; }
    .route-game output, .route-game pre { display: block; white-space: pre-wrap; overflow-wrap: anywhere; }
    .route-game #status { color: #8fd3a8; }
    .route-game #error { color: #ff9d9d; min-height: 1.5em; }
    .route-game pre { background: #0b0f14; padding: 1rem; border-radius: .5rem; }
    .route-game #greybox { display: block; width: 100%; aspect-ratio: 16 / 9; background: #080b0f;
      border: 1px solid #34404d; border-radius: .5rem; touch-action: none; }

    /* The authored room is the route, not an illustration above a diagnostics
       form. The overlays sit at the protected edge of the glass and remain
       ordinary DOM controls; nothing about this composition enters the renderer. */
    .route-game { position: relative; width: 100%; margin: 0; display: grid; }
    .game-stage { position: relative; isolation: isolate; overflow: hidden;
      height: calc(100svh - 1.9rem); min-height: 34rem; background: var(--studio-void);
      border: 0; border-bottom: 1px solid var(--studio-panel-line);
      box-shadow: var(--studio-bevel), 0 1.5rem 5rem rgba(0, 0, 0, .45); }
    .route-game #greybox { position: absolute; inset: 0; width: 100%; height: 100%;
      aspect-ratio: auto; border: 0; border-radius: 0; background: var(--studio-void); }
    .game-stage-shade { position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background:
        linear-gradient(180deg, rgba(7, 6, 5, .62) 0%, transparent 11%, transparent 74%, rgba(7, 6, 5, .74) 100%),
        linear-gradient(90deg, rgba(7, 6, 5, .42) 0%, transparent 18%, transparent 82%, rgba(7, 6, 5, .2) 100%); }
    .game-state, .game-command-deck, .game-performance, .game-stage-footer, .game-stage #error {
      position: absolute; z-index: 2; }
    .game-state { left: clamp(.65rem, 1.2vw, 1rem); bottom: clamp(.65rem, 1.2vw, 1rem);
      width: min(13.5rem, calc(100% - 1.3rem)); display: grid; gap: .32rem; padding: .48rem .58rem;
      border: 1px solid var(--studio-panel-line); border-radius: .3rem;
      border-top-color: rgba(232, 180, 92, .5); background: var(--studio-scrim);
      box-shadow: var(--studio-bevel), inset 0 -1px rgba(0, 0, 0, .65), 0 .35rem 1.2rem rgba(0, 0, 0, .34); }
    .game-vitals { display: flex; align-items: baseline; justify-content: space-between; gap: .65rem; }
    .game-vitals #respawn { padding: .18rem .38rem; font-size: .62rem; }
    .game-vitals > span { color: var(--studio-faint); font: .6rem/1 ui-monospace, Consolas, monospace;
      letter-spacing: .15em; text-transform: uppercase; }
    .route-game #party-health { color: #ddd1b8; font: 600 .68rem/1 ui-monospace, Consolas, monospace; }
    .route-game #party-health-bar { width: 100%; height: .28rem; border: 0; accent-color: var(--studio-amber); }
    .route-game .game-state #status { color: var(--studio-cyan); font-size: .68rem; line-height: 1.25; }
    .game-performance { top: .7rem; left: 50%; transform: translateX(-50%);
      padding: .35rem .55rem; background: var(--studio-scrim); border: 1px solid var(--studio-panel-line); }
    .route-game #game-fps { color: var(--studio-faint); font: .6rem/1 ui-monospace, Consolas, monospace;
      font-variant-numeric: tabular-nums; white-space: nowrap; }
    .route-game #game-view-mode { padding: .22rem .42rem; border-color: var(--studio-panel-line);
      background: #100d0a; color: var(--studio-cyan); font-size: .66rem; }
    .game-command-deck { right: clamp(.65rem, 1.2vw, 1rem); bottom: clamp(.65rem, 1.2vw, 1rem);
      display: flex; flex-wrap: wrap; justify-content: center; gap: .45rem;
      max-width: calc(100% - 31rem); }
    .route-game .game-command-deck fieldset { min-width: 0; margin: 0; padding: .42rem .55rem .55rem;
      border-color: var(--studio-panel-line); border-radius: .35rem;
      border-top-color: rgba(232, 180, 92, .42); background: var(--studio-scrim);
      box-shadow: var(--studio-bevel), inset 0 -1px rgba(0, 0, 0, .65), 0 .35rem 1.2rem rgba(0, 0, 0, .3); }
    .game-command-deck legend { padding: 0 .25rem; color: var(--studio-faint);
      font: 600 .6rem/1 ui-monospace, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; }
    .route-game .game-command-deck .controls { gap: .35rem; align-items: center; }
    .route-game .game-command-deck label { grid-template-columns: auto 4.6rem; align-items: center;
      gap: .3rem; color: var(--studio-dim); font-size: .68rem; }
    .route-game .game-command-deck input[type="number"] { width: 4.6rem; padding: .25rem .35rem;
      border-color: var(--studio-panel-line); background: #100d0a; }
    .route-game .game-command-deck button { padding: .3rem .5rem; border-color: var(--studio-panel-line);
      background: #100d0a; font-size: .72rem; }
    .route-game .game-command-deck button:hover { color: var(--studio-cyan); border-color: var(--studio-cyan); }
    .route-game .game-command-deck .equipment-slot { display: inline-flex; align-items: center; gap: .38rem;
      min-width: 6.8rem; padding: .24rem .48rem .24rem .3rem; text-align: left; }
    .equipment-slot .slot-art { width: 1.65rem; height: 1.65rem; flex: 0 0 auto;
      filter: drop-shadow(0 2px 2px #000); }
    .equipment-slot[aria-pressed="true"] .slot-art { filter:
      drop-shadow(0 0 3px rgba(127, 166, 189, .72)) drop-shadow(0 2px 2px #000); }
    .slot-art .iron { fill: #77766f; stroke: #c2b89f; stroke-width: 1.2; }
    .slot-art .iron-dark { fill: #292b2b; stroke: #847d6e; stroke-width: 1.1; }
    .slot-art .leather { fill: #563423; stroke: #a06a3f; stroke-width: 1; }
    .slot-art .edge { fill: #c8c3b4; }
    .game-stage-footer { top: clamp(.55rem, 1vw, .85rem); right: clamp(.65rem, 1.2vw, 1rem);
      max-width: min(34rem, 48%); display: flex; align-items: center; justify-content: flex-end; gap: .5rem; }
    .route-game .game-stage-footer p { margin: 0; color: var(--studio-dim); font-size: .68rem;
      line-height: 1.35; text-align: right; text-shadow: 0 1px 8px #000; }
    .route-game .game-stage-footer button { flex: 0 0 auto; padding: .3rem .5rem;
      border-color: var(--studio-panel-line); background: var(--studio-scrim); font-size: .7rem; }
    .route-game .game-stage #error { top: 3.4rem; right: clamp(.65rem, 1.2vw, 1rem);
      max-width: min(32rem, 60%); min-height: 0; color: var(--studio-red); font-size: .75rem; text-align: right; }
    .game-support { position: absolute; z-index: 3; right: clamp(.65rem, 1.2vw, 1rem);
      top: 3.4rem; bottom: 5.5rem; width: min(48rem, calc(100% - 1.3rem));
      display: flex; justify-content: flex-end; pointer-events: none; }
    .route-game .game-route-note { margin: 0; padding: .65rem .75rem 0; color: var(--studio-faint);
      font-size: .72rem; text-align: left; }
    .game-instruments { border: 1px solid var(--studio-panel-line); border-radius: .35rem;
      background: rgba(21, 18, 14, .96); box-shadow: var(--studio-bevel), 0 .6rem 2rem rgba(0, 0, 0, .45);
      pointer-events: auto; }
    .game-instruments:not([open]) { width: max-content; align-self: flex-start; }
    .game-instruments[open] { width: 100%; max-height: min(60svh, calc(100svh - 10rem)); overflow: auto; }
    .game-instruments > summary { padding: .55rem .75rem; color: var(--studio-dim); cursor: pointer;
      font: 600 .62rem/1 ui-monospace, Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; }
    .game-instruments[open] > summary { border-bottom: 1px solid var(--studio-panel-line); color: var(--studio-cyan); }
    .game-instrument-grid { display: grid; grid-template-columns: minmax(16rem, .8fr) minmax(22rem, 1.2fr);
      gap: .65rem; padding: .65rem; }
    .route-game .game-instrument-grid fieldset { margin: 0; border-color: var(--studio-panel-line); }
    .route-game .game-instrument-grid p { margin: .2rem 0 .65rem; color: var(--studio-dim); font-size: .76rem; }
    .game-metadata { display: grid !important; grid-template-columns: repeat(2, minmax(10rem, 1fr)); }
    .route-game .game-metadata label { display: grid; grid-template-columns: 3.8rem 1fr; align-items: center; }
    .route-game .game-metadata input[type="text"] { width: 100%; min-width: 0; }
    .route-game #performance-progress { width: 100%; margin-top: .65rem; accent-color: var(--studio-cyan); }
    .route-game #performance-status { color: var(--studio-cyan); font-size: .75rem; }
    .game-diagnostic-readout { grid-column: 1 / -1; min-width: 0; }
    .game-diagnostic-readout h2 { margin: 0 0 .35rem; color: var(--studio-faint); font-size: .68rem;
      letter-spacing: .12em; text-transform: uppercase; }
    .route-game .game-diagnostic-readout pre { max-height: 20rem; margin: 0; overflow: auto;
      border: 1px solid var(--studio-panel-line); background: #080705; color: var(--studio-dim);
      font: .7rem/1.45 ui-monospace, Consolas, monospace; }

    @media (max-width: 1100px) {
      .game-state { bottom: 4.8rem; }
      .game-command-deck { max-width: calc(100% - 1.3rem); }
      .game-stage-footer { max-width: 45%; }
      .game-stage-footer p { display: none; }
    }

    @media (max-width: 900px) {
      .game-stage { min-height: 40rem; }
      .game-instrument-grid { grid-template-columns: 1fr; }
      .game-diagnostic-readout { grid-column: auto; }
    }

    @media (max-width: 620px) {
      #studio-route { display: none; }
      .game-stage { min-height: 45rem; }
      .game-state { left: .55rem; bottom: 8rem; }
      .game-command-deck { left: .55rem; right: .55rem; bottom: .55rem;
        max-width: none; transform: none; flex-direction: column; }
      .game-command-deck fieldset { width: 100%; }
      .game-stage-footer { top: .55rem; right: .55rem; }
      .game-support { top: 3.2rem; right: .55rem; bottom: 15rem; }
      .game-metadata { grid-template-columns: 1fr; }
    }

    /* ---- the arena route ---- */
    .route-arena { width: min(110rem, 100%); margin: 0 auto; display: grid; gap: .6rem; }
    .route-arena h1 { font-size: 1.15rem; margin: 0; }
    .route-arena #status { font-size: .9rem; color: #8fd3a8; }
    .route-arena #status.error { color: #ff9d9d; }
    .route-arena canvas { display: block; width: 100%; background: #0b0f14;
      border: 1px solid #24303d; border-radius: .4rem; }
    .route-arena figure { margin: 0; display: grid; gap: .25rem; }
    .route-arena figcaption { font-size: .8rem; color: #7a8796; }
    .route-arena label { display: inline-flex; gap: .3rem; align-items: center;
      font-size: .85rem; color: #aeb9c6; }
    .route-arena .controls { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
      background: #151b23; border: 1px solid #24303d; border-radius: .4rem; padding: .5rem .65rem; }
    .route-arena pre, .route-arena #contacts { margin: 0; background: #0b0f14; border: 1px solid #24303d;
      border-radius: .4rem; padding: .65rem; font: 12.5px/1.5 ui-monospace, Menlo, Consolas, monospace;
      white-space: pre-wrap; overflow-wrap: anywhere; }
    .route-arena #contacts { max-height: 22rem; overflow-y: auto; }
    .route-arena .legend { font-size: .8rem; color: #7a8796; display: flex; flex-wrap: wrap; gap: .9rem; }
    .route-arena .legend b { font-weight: 600; }

    /* The loadout picker. One row a fighter, so the two rows read as a matchup
       rather than as a form. */
    .picker { display: grid; gap: .4rem; background: #151b23; border: 1px solid #24303d;
      border-radius: .4rem; padding: .5rem .65rem; }
    .picker-row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
    .picker-row > .side { min-width: 5.5rem; font-weight: 600; }
    .picker-row.hero > .side { color: #7fb2ff; }
    .picker-row.monster > .side { color: #ff8f7a; }
    #picker-message { font-size: .85rem; min-height: 1.4em; color: #d8b46a; }
    #picker-message.refused { color: #ff9d9d; }

    /* **The three 3D panels share one canvas and must stay contiguous.** They are
       three viewports of a single WebGL context, because a Babylon `Scene` belongs
       to one engine and three engines would mean building every mesh three times.
       Splitting this grid cell is not a layout tweak; the argument, and the
       fallback if a later design really wants the panels apart, is in
       `client/src/arena/scene.ts`'s module header. */
    .stage-row { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 1.35fr); gap: .6rem;
      align-items: start; }
    .stage { position: relative; }
    #arena-3d { aspect-ratio: 16 / 9; touch-action: none; }
    /* The three labels sit at the corners of the three viewport rectangles, so the
       28% below is the same split the cameras use and the two must move together.
       A label that has come off its own panel is the cheapest possible signal that
       a viewport rectangle was edited in one place and not the other. */
    .viewport-label { position: absolute; font-size: .75rem; color: #9fb0c2;
      text-shadow: 0 1px 2px #000; pointer-events: none; }
    #label-first-a { left: .5rem; top: .4rem; }
    #label-first-b { left: .5rem; top: calc(50% + .4rem); }
    #label-three-quarter { left: calc(28% + .5rem); top: .4rem; }
    .stage-modes { position: absolute; left: calc(28% + .5rem); bottom: .5rem; display: flex; gap: .35rem; }
    .stage-modes button[aria-pressed="true"] { background: #3d6089; border-color: #6d8cb4; }
    .side-panels { display: grid; gap: .6rem; }
    #plan, #elevation { aspect-ratio: 3 / 2; }
    #chart { aspect-ratio: 9 / 1; cursor: crosshair; }
    #scrub { flex: 1 1 18rem; min-width: 10rem; }
    #tick { font-variant-numeric: tabular-nums; min-width: 10rem; }
    .panels { display: grid; grid-template-columns: 3fr 2fr; gap: .6rem; align-items: start; }
  </style>
</head>
<body>
  <nav id="studio-bar">
    <a id="studio-title" href="#/">Auto RPG</a>
    <span id="studio-route"></span>
    <span id="studio-error" role="alert"></span>
  </nav>
  <main id="studio-root"></main>

  <template id="route-home">
    <div class="route-home">
      <h1>Auto RPG</h1>
      <p class="muted">One application. Start a game, or take two loadouts into the arena and
        watch the fight they produce from five viewpoints at once.</p>
      <div class="destinations">
        <section class="destination">
          <h2>New Game</h2>
          <p>The worker-owned simulation, rendered through the v2 GPU presentation path.
            Backend selection and the disclosed-state registry are shown beside it.</p>
          <a class="enter" href="#/game">New Game</a>
        </section>
        <section class="destination">
          <h2>Battle Arena</h2>
          <p>Two articulated fighters, a seed, and a fight watched from both first-person
            views, a 3/4 view, a plan and an elevation.</p>
          <a class="enter" href="#/arena">Battle Arena</a>
        </section>
      </div>
    </div>
  </template>

  <template id="route-game">
    <div class="route-game">
      <section class="game-stage" aria-label="Dungeon expedition">
        <canvas id="greybox" width="1280" height="720" aria-label="Procedural game view"></canvas>
        <div class="game-stage-shade" aria-hidden="true"></div>

        <div class="game-state" aria-label="Party status">
          <div class="game-vitals">
            <span>Party health</span>
            <output id="party-health">-- / --</output>
            <button id="respawn" data-sim-control type="button" hidden>Respawn</button>
          </div>
          <progress id="party-health-bar" max="1" value="0" aria-label="Party health"></progress>
          <output id="status" aria-live="polite">Starting worker&hellip;</output>
        </div>
        <div class="game-performance"><output id="game-fps" aria-label="Frame rate">-- FPS / -- ms worst</output></div>

        <aside class="game-command-deck" aria-label="Expedition controls">
          <fieldset>
            <legend>Equipment</legend>
            <div class="controls">
              <button id="slot-1" class="equipment-slot" data-sim-control type="button" aria-pressed="true">
                <svg class="slot-art" viewBox="0 0 32 32" aria-hidden="true">
                  <path class="iron" d="m21.8 2.5 5.7 2.2-14.8 18.1-3.6-3.6z"/>
                  <path class="edge" d="m22.4 4.5 2.5 1-13.5 15.8-.9-.9z"/>
                  <path class="iron-dark" d="m7.1 17.2 7.7 7.7-2.3 2.3-7.7-7.7z"/>
                  <path class="leather" d="m8.7 24.2 2.4 2.4-4.5 4.5-2.4-2.4z"/>
                  <circle class="edge" cx="5.1" cy="30" r="1.3"/>
                </svg>
                <span>Sword [1]</span>
              </button>
              <button id="slot-2" class="equipment-slot" data-sim-control type="button" aria-pressed="false">
                <svg class="slot-art" viewBox="0 0 32 32" aria-hidden="true">
                  <path class="iron-dark" d="M16 2 27 6v9c0 7-4.3 11.7-11 15C9.3 26.7 5 22 5 15V6Z"/>
                  <path class="iron" d="M16 5.2 23.8 8v7c0 5.2-3 8.8-7.8 11.5C11.2 23.8 8.2 20.2 8.2 15V8Z"/>
                  <path class="leather" d="M15 5.7h2v20h-2z"/>
                  <circle class="edge" cx="16" cy="15" r="3.1"/>
                  <path class="iron-dark" d="M9 10.4 16 7l7 3.4v2L16 9l-7 3.4z"/>
                </svg>
                <span>Shield [2]</span>
              </button>
            </div>
          </fieldset>
          <fieldset>
            <legend>Control</legend>
            <div class="controls">
              <button id="pause" data-sim-control type="button">Pause</button>
              <button id="control-movement" data-sim-control type="button" aria-pressed="false">Movement</button>
              <button id="control-action" data-sim-control type="button" aria-pressed="false">Action</button>
              <button id="control-aim" data-sim-control type="button" aria-pressed="true">Aim</button>
            </div>
          </fieldset>
        </aside>

        <div class="game-stage-footer">
          <p id="interaction-hint">Interactive controls become available after startup.</p>
          <label class="view-mode-label">View [G / Shift+G]
            <select id="game-view-mode" disabled>
              <option value="world">World</option>
              <option value="geometry">Geometry</option>
              <option value="top_down">Top Down</option>
              <option value="first_person">First Person</option>
              <option value="free">Free</option>
              <option value="dev">Dev</option>
            </select>
          </label>
        </div>
        <output id="error" aria-live="assertive"></output>
      </section>

      <div class="game-support">
        <details class="game-instruments">
          <summary>Systems and capture</summary>
          <p class="game-route-note">The authored room is the production view. Use
            <code>?room=procedural</code> for the procedural diagnostic.</p>
          <div class="game-instrument-grid">
            <fieldset>
              <legend>Simulation</legend>
              <div class="controls">
                <label>Seed <input id="seed" type="number" min="0" max="4294967295" value="1"></label>
                <button id="reset" data-sim-control type="button">Reset</button>
                <label>Body/stats <select id="spawn-kind"><option value="2">Brute</option><option value="0">Fighter</option></select></label>
                <label>Primary <select id="spawn-primary"><option value="2">Sword</option><option value="4">Shield</option></select></label>
                <label>Secondary <select id="spawn-secondary"><option value="255">Empty</option><option value="2">Sword</option><option value="4">Shield</option></select></label>
                <button id="spawn" data-sim-control type="button">Spawn enemy</button>
              </div>
            </fieldset>
            <fieldset>
              <legend>Buffer exhaustion diagnostic</legend>
              <p>Retain the next three distinct snapshot leases. The worker keeps acknowledging
                advances while snapshots coalesce; release restores the latest publication.</p>
              <div class="controls">
                <button id="diagnostic-hold-buffers" data-sim-control type="button">Hold next three snapshots</button>
                <button id="diagnostic-release-buffers" data-sim-control type="button" disabled>Release held snapshots</button>
              </div>
            </fieldset>
            <fieldset>
              <legend>Visible foreground performance capture</legend>
              <p>Available for the fixed <code>?stress=greybox</code> control and
                <code>?stress=room&amp;room=representative</code>. Starting uses the named
                1920 &times; 1080 surface, warms for 30 seconds, then samples for 120 seconds.</p>
              <div class="controls game-metadata">
                <label>OS <input id="perf-os" data-performance-metadata type="text" value="Windows 11 Home 25H2 build 26200.8973"></label>
                <label>CPU <input id="perf-cpu" data-performance-metadata type="text" value="13th Gen Intel Core i7-13700H"></label>
                <label>GPU <input id="perf-gpu" data-performance-metadata type="text" value="Intel Iris Xe Graphics"></label>
                <label>Driver <input id="perf-driver" data-performance-metadata type="text" value="32.0.101.7084"></label>
                <label>Browser <input id="perf-browser" data-performance-metadata type="text" value="Chrome 151.0.7922.72"></label>
                <label>Power <input id="perf-power" data-performance-metadata type="text" value="AC / Balanced"></label>
              </div>
              <div class="controls">
                <button id="performance-start" type="button" disabled>Start capture</button>
                <button id="performance-download" type="button" disabled>Download raw JSON</button>
              </div>
              <progress id="performance-progress" max="150" value="0" aria-label="Performance capture progress"></progress>
              <output id="performance-status" aria-live="polite">Idle</output>
            </fieldset>
            <section class="game-diagnostic-readout" aria-labelledby="diagnostic-title">
              <h2 id="diagnostic-title">Disclosed-state registry</h2>
              <pre id="diagnostics">No snapshot yet.</pre>
            </section>
          </div>
        </details>
      </div>
    </div>
  </template>

  <template id="route-arena">
    <div class="route-arena">
      <h1>Battle Arena</h1>

      <div class="picker">
        <!-- The `demo` row held one alternative to "Custom fight": the Robust
             Strike controlled demonstration, which v2-ui-08 deleted along with
             the 120-byte preset in `crates/web` that recognised it. A select
             with one option is a control that does nothing, so the row went with
             it rather than being left standing. -->
        <div class="picker-row hero">
          <span class="side">Fighter A</span>
          <label>anatomy
            <select id="a-anatomy">
              <option value="fighter" selected>Fighter</option>
              <option value="brute">Brute</option>
            </select>
          </label>
          <label>left hand
            <select id="a-left">
              <option value="empty">empty</option>
              <option value="sword">Sword</option>
              <option value="shield" selected>Shield</option>
              <option value="club">Club</option>
              <option value="bow">Bow</option>
            </select>
          </label>
          <label>right hand
            <select id="a-right">
              <option value="empty">empty</option>
              <option value="sword" selected>Sword</option>
              <option value="shield">Shield</option>
              <option value="club">Club</option>
              <option value="bow">Bow</option>
            </select>
          </label>
          <label>two-handed <input id="a-two-handed" type="checkbox"></label>
          <label>policy <select id="a-policy"></select></label>
        </div>
        <div class="picker-row monster">
          <span class="side">Fighter B</span>
          <label>anatomy
            <select id="b-anatomy">
              <option value="fighter">Fighter</option>
              <option value="brute" selected>Brute</option>
            </select>
          </label>
          <label>left hand
            <select id="b-left">
              <option value="empty" selected>empty</option>
              <option value="sword">Sword</option>
              <option value="shield">Shield</option>
              <option value="club">Club</option>
              <option value="bow">Bow</option>
            </select>
          </label>
          <label>right hand
            <select id="b-right">
              <option value="empty">empty</option>
              <option value="sword">Sword</option>
              <option value="shield">Shield</option>
              <option value="club" selected>Club</option>
              <option value="bow">Bow</option>
            </select>
          </label>
          <label>two-handed <input id="b-two-handed" type="checkbox"></label>
          <label>policy <select id="b-policy"></select></label>
          <label>seed <input id="arena-seed" type="number" min="0" max="4294967295" value="3"></label>
          <button id="fight" type="button">Run selected fight</button>
        </div>
        <div id="picker-message"></div>
      </div>

      <div id="status">Loading fight&hellip;</div>

      <div class="stage-row">
        <div class="stage">
          <canvas id="arena-3d" aria-label="Arena, three viewpoints"></canvas>
          <span class="viewport-label" id="label-first-a">first-person A</span>
          <span class="viewport-label" id="label-first-b">first-person B</span>
          <span class="viewport-label" id="label-three-quarter">3/4 view</span>
          <div class="stage-modes">
            <button id="mode-texture" type="button" aria-pressed="false">Texture</button>
            <button id="mode-geometry" type="button" aria-pressed="true">Geometry</button>
          </div>
        </div>
        <div class="side-panels">
          <figure>
            <canvas id="plan" width="900" height="620"></canvas>
            <figcaption>Plan &mdash; a bird's eye: x right, <b>y up</b>, so a body's left hand
              is on the side the simulation calls left. The legacy Canvas page draws y the
              other way. One grid square is one world unit.</figcaption>
          </figure>
          <figure>
            <canvas id="elevation" width="900" height="620"></canvas>
            <figcaption>Elevation &mdash; along the chosen azimuth, z up, floor at the bright line.</figcaption>
          </figure>
        </div>
      </div>

      <figure>
        <canvas id="chart" width="1800" height="220"></canvas>
        <figcaption>Click to scrub. Upper band: blade tip travel per tick against
          <code>IMPACT_THRESHOLD</code> &mdash; world-space, so a walking fighter's feet count,
          and the bar itself is the legacy model's. Lower band: the energy allocated to each
          tick's loudest contact against <code>CONTACT_ENERGY_FLOOR</code>, which is deducted
          from exactly that allocation &mdash; <em>not</em> the group's kinetic-energy ledger,
          which the floor is never charged against. Both lines are read out of the Rust that
          owns them.</figcaption>
      </figure>

      <div class="controls">
        <button id="play" type="button">Play</button>
        <button id="step-back" type="button" title="Left arrow; shift for ten">&minus;1</button>
        <button id="step-forward" type="button" title="Right arrow; shift for ten">+1</button>
        <button id="prev-contact" type="button" title="[">&#9664; contact</button>
        <button id="next-contact" type="button" title="]">contact &#9654;</button>
        <button id="prev-wound" type="button">&#9664; wound</button>
        <button id="next-wound" type="button">wound &#9654;</button>
        <input id="scrub" type="range" min="0" max="1" value="0" step="1" aria-label="Tick">
        <span id="tick">tick 0</span>
        <label>Speed
          <select id="rate">
            <option value="0.1">0.1x</option>
            <option value="0.25">0.25x</option>
            <option value="1" selected>1x</option>
            <option value="4">4x</option>
            <option value="16">16x</option>
          </select>
        </label>
        <label>Span
          <input id="span" type="range" min="2" max="26" value="6" step="1" aria-label="World units across">
        </label>
        <label>Azimuth
          <input id="azimuth" type="range" min="-180" max="180" value="0" step="5" aria-label="Elevation azimuth">
        </label>
        <label><input id="show-regions" type="checkbox" checked> regions</label>
        <label><input id="show-targets" type="checkbox" checked> commanded hand</label>
        <label><input id="show-velocity" type="checkbox"> velocity</label>
        <label><input id="show-contacts" type="checkbox" checked> contacts</label>
      </div>

      <div class="panels">
        <pre id="readout">&hellip;</pre>
        <div id="contacts" class="muted">&hellip;</div>
      </div>

      <p class="legend">
        <span><b>chase</b> is commanded hand minus actual hand, both published.</span>
        <span><b>reach</b> is the arm capsule's own length over the anatomy's arm length.</span>
        <span><b>Span</b> frames all five panels alike; <b>Azimuth</b> turns the elevation and the
          3/4 view together, which is how you look behind a body at a contact.</span>
        <span><b>Space</b> plays, <b>arrows</b> step, <b>[</b> and <b>]</b> jump between contacts.</span>
        <span>Regenerate the recorded fights with <code>npm run trace</code>.</span>
        <span>Watch a <b>learned</b> fight with
          <code>cargo run --release -p lab -- trace --policy learned --checkpoint checkpoints/v2-probe.ckpt --seed 3</code>
          &mdash; the header then names both sides and the checkpoint digest.</span>
      </p>
    </div>
  </template>

  <script type="module" src="/client-src/studio.ts"></script>
</body>
</html>
